name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_SUPERUSER_URL: postgresql://pos:pos@localhost:5432/pos_dev

jobs:
  packages:
    name: shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pos/contracts --filter @pos/nest-common --filter @pos/testing build
      - run: pnpm --filter @pos/contracts --filter @pos/nest-common --filter @pos/testing test
      - run: pnpm --filter @pos/contracts --filter @pos/nest-common --filter @pos/testing lint

  contracts-compat:
    name: contracts backward-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-contracts-compat.mjs "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"

  service:
    name: service (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              service: identity,
              dir: services/identity,
              schema: identity,
              url_var: IDENTITY_DATABASE_URL,
            }
          - {
              service: tenancy,
              dir: services/tenancy,
              schema: tenancy,
              url_var: TENANCY_DATABASE_URL,
            }
          - {
              service: catalog,
              dir: services/catalog,
              schema: catalog,
              url_var: CATALOG_DATABASE_URL,
            }
          - {
              service: inventory,
              dir: services/inventory,
              schema: inventory,
              url_var: INVENTORY_DATABASE_URL,
            }
          - { service: sales, dir: services/sales, schema: sales, url_var: SALES_DATABASE_URL }
          - { service: winger, dir: services/winger, schema: winger, url_var: WINGER_DATABASE_URL }
          - {
              service: notifications,
              dir: services/notifications,
              schema: notifications,
              url_var: NOTIFICATIONS_DATABASE_URL,
            }
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: pos, POSTGRES_PASSWORD: pos, POSTGRES_DB: pos_dev }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos" --health-interval 5s --health-timeout 5s --health-retries 10
      nats:
        image: nats:2.10-alpine
        ports: ['4222:4222', '8222:8222']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: provision schemas + roles
        run: |
          psql "$POSTGRES_SUPERUSER_URL" -v ON_ERROR_STOP=1 \
            -f infra/postgres/initdb/10-app-role.sql \
            -f infra/postgres/initdb/20-service-schemas.sql
      - run: pnpm --filter @pos/contracts --filter @pos/nest-common --filter @pos/testing build
      - name: migrate
        working-directory: ${{ matrix.dir }}
        env:
          IDENTITY_DATABASE_URL: postgresql://identity_app:identity_app@localhost:5432/pos_dev?schema=identity
          TENANCY_DATABASE_URL: postgresql://tenancy_app:tenancy_app@localhost:5432/pos_dev?schema=tenancy
          CATALOG_DATABASE_URL: postgresql://catalog_app:catalog_app@localhost:5432/pos_dev?schema=catalog
          INVENTORY_DATABASE_URL: postgresql://inventory_app:inventory_app@localhost:5432/pos_dev?schema=inventory
          SALES_DATABASE_URL: postgresql://sales_app:sales_app@localhost:5432/pos_dev?schema=sales
          WINGER_DATABASE_URL: postgresql://winger_app:winger_app@localhost:5432/pos_dev?schema=winger
          NOTIFICATIONS_DATABASE_URL: postgresql://notifications_app:notifications_app@localhost:5432/pos_dev?schema=notifications
        run: pnpm exec prisma migrate deploy
      - name: lint / test / build
        working-directory: ${{ matrix.dir }}
        env:
          NODE_ENV: test
          IDENTITY_DATABASE_URL: postgresql://identity_app:identity_app@localhost:5432/pos_dev?schema=identity
          TENANCY_DATABASE_URL: postgresql://tenancy_app:tenancy_app@localhost:5432/pos_dev?schema=tenancy
          CATALOG_DATABASE_URL: postgresql://catalog_app:catalog_app@localhost:5432/pos_dev?schema=catalog
          INVENTORY_DATABASE_URL: postgresql://inventory_app:inventory_app@localhost:5432/pos_dev?schema=inventory
          SALES_DATABASE_URL: postgresql://sales_app:sales_app@localhost:5432/pos_dev?schema=sales
          WINGER_DATABASE_URL: postgresql://winger_app:winger_app@localhost:5432/pos_dev?schema=winger
          NOTIFICATIONS_DATABASE_URL: postgresql://notifications_app:notifications_app@localhost:5432/pos_dev?schema=notifications
          JWT_ACCESS_SECRET: ci-only-access-secret-0123456789
          INTERNAL_CONTEXT_SECRET: ci-only-internal-context-secret-0123456789
          INTERNAL_API_KEY: ci-internal-api-key
          NATS_URL: nats://localhost:4222
        run: |
          pnpm lint
          pnpm test
          pnpm build
      - name: docker build
        run: |
          test -f ${{ matrix.dir }}/Dockerfile && docker build -f ${{ matrix.dir }}/Dockerfile -t pos-${{ matrix.service }}:ci . || echo "no Dockerfile for ${{ matrix.service }}"

  edge:
    name: kong config + k8s render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kong config parse
        run: |
          docker run --rm -e KONG_DATABASE=off -e KONG_PLUGINS=bundled,pos-internal-context \
            -e JWT_ACCESS_SECRET=x -e INTERNAL_CONTEXT_SECRET=x -e INTERNAL_API_KEY=x \
            -v "$PWD/infra/kong/kong.yml:/kong/kong.yml:ro" \
            -v "$PWD/infra/kong/plugins/pos-internal-context:/usr/local/share/lua/5.1/kong/plugins/pos-internal-context:ro" \
            kong:3.7 kong config parse /kong/kong.yml
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize infra/k8s/base > /dev/null

  docs:
    name: workflow docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 .agents/workflows/workflow-contract/scripts/validate_workflow.py

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint && pnpm --filter web build

  # MVP acceptance: the full compose stack + the U1-U13 walk-through and the two
  # edge / DR smokes. Per-story unit coverage lives in the `service` matrix
  # (isolation / rls-backstop / concurrency specs); this is the end-to-end gate.
  acceptance:
    name: acceptance (U1-U13 e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: build shared + identity (the smoke hashes an operator password)
        run: |
          pnpm --filter @pos/contracts --filter @pos/nest-common build
          pnpm --filter @pos/identity exec prisma generate
          pnpm --filter @pos/identity build
      - name: bring up the stack
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml up -d --build
      - name: wait for readiness
        run: |
          for svc in identity tenancy catalog inventory sales winger notifications; do
            for i in $(seq 1 60); do
              docker compose -f infra/docker-compose.yml exec -T "$svc" wget -q -O - http://localhost:3000/readyz >/dev/null 2>&1 && break
              sleep 3
            done
          done
          for i in $(seq 1 30); do curl -sf http://localhost:8001/status >/dev/null && break; sleep 2; done
      - name: migrate every service
        run: |
          for d in identity tenancy catalog inventory sales winger notifications; do
            docker compose -f infra/docker-compose.yml exec -T "$d" pnpm exec prisma migrate deploy
          done
      - run: bash infra/acceptance-smoke.sh
      - run: bash infra/rate-limit-smoke.sh
      - run: bash infra/restore-drill.sh
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --tail 100
