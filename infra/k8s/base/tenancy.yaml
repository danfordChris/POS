apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenancy
  labels:
    app.kubernetes.io/name: tenancy
    app.kubernetes.io/part-of: pos-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tenancy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenancy
    spec:
      containers:
        - name: tenancy
          image: ghcr.io/pos/tenancy:latest
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: pos-shared }
            - secretRef: { name: pos-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tenancy
  labels:
    app.kubernetes.io/name: tenancy
spec:
  selector:
    app.kubernetes.io/name: tenancy
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tenancy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tenancy
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tenancy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenancy
