# Kong DB-less declarative config + the custom plugin, mounted into the pod.
# In production these come from `kubectl create configmap ... --from-file`
# (or the Kong Helm chart); this base keeps a checked-in copy for `kustomize build`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative
data:
  kong.yml: |
    _format_version: '3.0'
    services:
      - name: identity
        url: http://identity:3000
        routes:
          - name: auth-public
            paths: ['~/v1/auth/(register|login|refresh)$', /v1/auth/operator/login]
            strip_path: false
            plugins:
              - name: rate-limiting
                config: { minute: 60, policy: local, limit_by: ip }
          - name: auth-private
            paths: [/v1/auth/logout, /v1/auth/me, /v1/auth/operator/me]
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: false
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
      - name: tenancy
        url: http://tenancy:3000
        routes:
          - name: businesses
            paths: [/v1/businesses]
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: true
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
          - name: invitations
            paths: [/v1/invitations]
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: false
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
          - name: admin-control-plane
            paths: [/v1/admin]
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: false
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
      - name: catalog
        url: http://catalog:3000
        routes:
          - name: catalog-tenant
            paths: ['~/v1/businesses/[^/]+/categories', '~/v1/businesses/[^/]+/products']
            regex_priority: 100
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: true
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
      - name: inventory
        url: http://inventory:3000
        routes:
          - name: inventory-tenant
            paths:
              ['~/v1/businesses/[^/]+/stock', '~/v1/businesses/[^/]+/alert-config']
            regex_priority: 100
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: true
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
      - name: sales
        url: http://sales:3000
        routes:
          - name: sales-tenant
            paths: ['~/v1/businesses/[^/]+/sales']
            regex_priority: 100
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: true
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
          # Trade customers + accounts receivable (Phase 07). Business-scoped.
          - name: sales-customers-tenant
            paths: ['~/v1/businesses/[^/]+/customers']
            regex_priority: 100
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: true
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
          # Invoices (Phase 07). Business-scoped.
          - name: sales-invoices-tenant
            paths: ['~/v1/businesses/[^/]+/invoices']
            regex_priority: 100
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: true
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
          # Public receipt — no auth, no internal-context plugin.
          - name: receipt-public
            paths: ['~/v1/r/[^/]+']
            regex_priority: 100
            strip_path: false
            plugins:
              - name: rate-limiting
                config: { minute: 120, policy: local, limit_by: ip }
          # Public invoice view — no auth, no internal-context plugin.
          - name: invoice-public
            paths: ['~/v1/i/[^/]+']
            regex_priority: 100
            strip_path: false
            plugins:
              - name: rate-limiting
                config: { minute: 120, policy: local, limit_by: ip }
      - name: winger
        url: http://winger:3000
        routes:
          - name: winger-accounts-tenant
            paths: ['~/v1/businesses/[^/]+/winger-accounts']
            regex_priority: 100
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: true
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
          - name: winger-portal
            paths: ['/v1/winger']
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: false
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
      - name: media
        url: http://media:3000
        routes:
          # Invoice PDF (Phase 07). Priority above sales-invoices-tenant.
          - name: media-invoice-pdf-tenant
            paths: ['~/v1/businesses/[^/]+/invoices/[^/]+/pdf']
            regex_priority: 200
            strip_path: false
            plugins:
              - name: pos-internal-context
                config:
                  jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
                  internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
                  require_business_scope: true
                  tenancy_membership_url: http://tenancy:3000/v1/internal/membership
                  internal_api_key: '{vault://env/INTERNAL_API_KEY}'
          # Public invoice PDF — no auth. Priority above invoice-public.
          - name: media-invoice-pdf-public
            paths: ['~/v1/i/[^/]+/pdf']
            regex_priority: 200
            strip_path: false
            plugins:
              - name: rate-limiting
                config: { minute: 120, policy: local, limit_by: ip }
    plugins:
      - name: cors
        config: { origins: ['*'], methods: [GET, POST, PATCH, PUT, DELETE, OPTIONS] }
      - name: correlation-id
        config: { header_name: X-Request-Id, generator: uuid, echo_downstream: true }
