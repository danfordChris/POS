apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pos

labels:
  - pairs:
      app.kubernetes.io/part-of: pos-platform
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - network-policy.yaml
  - nats.yaml
  - kong-config.yaml
  - kong.yaml
  - identity.yaml
  - tenancy.yaml
  - catalog.yaml
  - inventory.yaml
  - notifications.yaml
  - sales.yaml
  - winger.yaml
  - media.yaml
