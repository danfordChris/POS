# EXAMPLE ONLY — do not commit real secrets. In each environment this Secret is
# supplied by the cluster's secret manager (sealed-secrets / external-secrets /
# SOPS). Keys must match what the services read from the environment.
apiVersion: v1
kind: Secret
metadata:
  name: pos-secrets
type: Opaque
stringData:
  # One shared Postgres instance; one schema + role per service.
  IDENTITY_DATABASE_URL: postgresql://identity_app:CHANGE_ME@postgres:5432/pos?schema=identity
  TENANCY_DATABASE_URL: postgresql://tenancy_app:CHANGE_ME@postgres:5432/pos?schema=tenancy
  JWT_ACCESS_SECRET: CHANGE_ME
  INTERNAL_CONTEXT_SECRET: CHANGE_ME
