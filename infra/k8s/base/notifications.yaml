# notifications is a worker: no inbound HTTP beyond health, scales on NATS lag —
# Deployment + PDB only (no Service, no CPU HPA). See examples/service.template.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: pos-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications
    spec:
      containers:
        - name: notifications
          image: ghcr.io/pos/notifications:latest
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: pos-shared }
            - secretRef: { name: pos-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notifications
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications
