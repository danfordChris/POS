# Local development stack for the POS platform.
# One Postgres (schema + non-superuser role per service), NATS (JetStream), MinIO, Mailpit.
# The per-service containers (gateway/identity/tenancy/...) are added in T-0112+.
# Usage: docker compose -f infra/docker-compose.yml up -d

name: pos-local

services:
  postgres:
    # 18 for the native uuidv7() function used by the Prisma schemas.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos}
      POSTGRES_DB: ${POSTGRES_DB:-pos_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # postgres:18+ images store data under a version subdirectory; mount the parent.
      - postgres-data:/var/lib/postgresql
      # One-shot init: one schema + non-superuser role per service.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build: { context: .., dockerfile: services/identity/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      IDENTITY_PORT: '3000'
      IDENTITY_DATABASE_URL: postgresql://identity_app:identity_app@postgres:5432/pos_dev?schema=identity
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me}
      ACCESS_TOKEN_TTL_SECONDS: '900'
      REFRESH_TOKEN_TTL_DAYS: '30'
      NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:3000/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  tenancy:
    build: { context: .., dockerfile: services/tenancy/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TENANCY_PORT: '3000'
      TENANCY_DATABASE_URL: postgresql://tenancy_app:tenancy_app@postgres:5432/pos_dev?schema=tenancy
      NATS_URL: nats://nats:4222
      INTERNAL_CONTEXT_SECRET: ${INTERNAL_CONTEXT_SECRET:-dev-only-internal-context-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key}
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:3000/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  catalog:
    build: { context: .., dockerfile: services/catalog/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CATALOG_PORT: '3000'
      CATALOG_DATABASE_URL: postgresql://catalog_app:catalog_app@postgres:5432/pos_dev?schema=catalog
      NATS_URL: nats://nats:4222
      INTERNAL_CONTEXT_SECRET: ${INTERNAL_CONTEXT_SECRET:-dev-only-internal-context-secret-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pos-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pos-local-secret}
      S3_BUCKET: ${S3_BUCKET:-pos-media}
      S3_FORCE_PATH_STYLE: 'true'
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/pos-media}
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:3000/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  inventory:
    build: { context: .., dockerfile: services/inventory/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INVENTORY_PORT: '3000'
      INVENTORY_DATABASE_URL: postgresql://inventory_app:inventory_app@postgres:5432/pos_dev?schema=inventory
      NATS_URL: nats://nats:4222
      INTERNAL_CONTEXT_SECRET: ${INTERNAL_CONTEXT_SECRET:-dev-only-internal-context-secret-change-me}
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:3000/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  notifications:
    build: { context: .., dockerfile: services/notifications/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NOTIFICATIONS_PORT: '3000'
      NOTIFICATIONS_DATABASE_URL: postgresql://notifications_app:notifications_app@postgres:5432/pos_dev?schema=notifications
      NATS_URL: nats://nats:4222
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAIL_FROM: ${MAIL_FROM:-POS Platform <no-reply@pos.local>}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:3000/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  kong:
    image: kong:3.7
    restart: unless-stopped
    depends_on:
      identity: { condition: service_started }
      tenancy: { condition: service_started }
      catalog: { condition: service_started }
      inventory: { condition: service_started }
    environment:
      KONG_DATABASE: 'off'
      KONG_VAULTS: env
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
      KONG_PLUGINS: 'bundled,pos-internal-context'
      KONG_NGINX_WORKER_PROCESSES: '1'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me}
      INTERNAL_CONTEXT_SECRET: ${INTERNAL_CONTEXT_SECRET:-dev-only-internal-context-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key}
      IDENTITY_URL: ${IDENTITY_URL:-http://identity:3000}
      TENANCY_URL: ${TENANCY_URL:-http://tenancy:3000}
      CATALOG_URL: ${CATALOG_URL:-http://catalog:3000}
      INVENTORY_URL: ${INVENTORY_URL:-http://inventory:3000}
      TENANCY_MEMBERSHIP_URL: ${TENANCY_MEMBERSHIP_URL:-http://tenancy:3000/v1/internal/membership}
    ports:
      - '${KONG_PROXY_PORT:-8000}:8000'
      - '${KONG_ADMIN_PORT:-8001}:8001'
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
      - ./kong/plugins/pos-internal-context:/usr/local/share/lua/5.1/kong/plugins/pos-internal-context:ro
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    # -js: JetStream; -m 8222: HTTP monitoring (/healthz, /varz).
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '${NATS_PORT:-4222}:4222'
      - '${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:8222/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pos-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-pos-local-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-pos-local} ${S3_SECRET_KEY:-pos-local-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-pos-media} &&
      mc anonymous set download local/${S3_BUCKET:-pos-media} &&
      echo 'bucket ready';
      "
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', 'sh', '-c', 'wget -q -O - http://localhost:8025/readyz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nats-data:
