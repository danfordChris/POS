# Local development stack for the POS platform.
# One Postgres (schema + non-superuser role per service), NATS (JetStream), MinIO, Mailpit.
# The per-service containers (gateway/identity/tenancy/...) are added in T-0112+.
# The monolith `api` is retired in T-0117; it currently runs on the `public` schema.
# Usage: docker compose -f infra/docker-compose.yml up -d

name: pos-local

services:
  postgres:
    # 18 for the native uuidv7() function used by the Prisma schemas.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos}
      POSTGRES_DB: ${POSTGRES_DB:-pos_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # postgres:18+ images store data under a version subdirectory; mount the parent.
      - postgres-data:/var/lib/postgresql
      # One-shot init: `pos_app` (api, public schema) + one schema/role per service.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    # -js: JetStream; -m 8222: HTTP monitoring (/healthz, /varz).
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '${NATS_PORT:-4222}:4222'
      - '${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:8222/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pos-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-pos-local-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-pos-local} ${S3_SECRET_KEY:-pos-local-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-pos-media} &&
      mc anonymous set download local/${S3_BUCKET:-pos-media} &&
      echo 'bucket ready';
      "
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', 'sh', '-c', 'wget -q -O - http://localhost:8025/readyz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nats-data:
