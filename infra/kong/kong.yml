_format_version: '3.0'

# DB-less declarative config for the POS edge.
# Secrets are pulled from the environment via Kong's built-in `env` vault:
#   {vault://env/JWT_ACCESS_SECRET} etc. must be present in Kong's environment.
# Upstream hostnames are the compose / k8s service names; override the whole file
# for other environments.

services:
  - name: identity
    url: http://identity:3000
    routes:
      - name: auth-public
        # register / login / refresh / operator login — no auth context needed
        paths:
          - ~/v1/auth/(register|login|refresh)$
          - /v1/auth/operator/login
        strip_path: false
        plugins:
          - name: rate-limiting
            config: { minute: 60, policy: local, limit_by: ip }
      - name: auth-private
        # logout / me / operator me — needs a valid token; no business scope
        paths:
          - /v1/auth/logout
          - /v1/auth/me
          - /v1/auth/operator/me
        strip_path: false
        plugins:
          - name: pos-internal-context
            config:
              jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
              internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
              internal_context_ttl: 60
              require_business_scope: false
              tenancy_membership_url: http://tenancy:3000/v1/internal/membership
              internal_api_key: '{vault://env/INTERNAL_API_KEY}'
              membership_cache_ttl: 30

  - name: tenancy
    url: http://tenancy:3000
    routes:
      - name: businesses
        paths:
          - /v1/businesses
        strip_path: false
        plugins:
          - name: pos-internal-context
            config:
              jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
              internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
              internal_context_ttl: 60
              require_business_scope: true
              tenancy_membership_url: http://tenancy:3000/v1/internal/membership
              internal_api_key: '{vault://env/INTERNAL_API_KEY}'
              membership_cache_ttl: 30
      # Invitation accept — the invitee is authenticated but not yet a member.
      - name: invitations
        paths:
          - /v1/invitations
        strip_path: false
        plugins:
          - name: pos-internal-context
            config:
              jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
              internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
              internal_context_ttl: 60
              require_business_scope: false
              tenancy_membership_url: http://tenancy:3000/v1/internal/membership
              internal_api_key: '{vault://env/INTERNAL_API_KEY}'
              membership_cache_ttl: 30
      # Control-plane — audience `operator`. No membership scope; the tenancy
      # service enforces the operator gate + break-glass grants + audit log.
      - name: admin-control-plane
        paths:
          - /v1/admin
        strip_path: false
        plugins:
          - name: pos-internal-context
            config:
              jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
              internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
              internal_context_ttl: 60
              require_business_scope: false
              tenancy_membership_url: http://tenancy:3000/v1/internal/membership
              internal_api_key: '{vault://env/INTERNAL_API_KEY}'
              membership_cache_ttl: 30

  - name: catalog
    url: http://catalog:3000
    routes:
      - name: catalog-tenant
        # more specific than tenancy's `/v1/businesses` prefix — regex + priority
        # so `/v1/businesses/:id/(categories|products)` routes here, not to tenancy.
        paths:
          - ~/v1/businesses/[^/]+/categories
          - ~/v1/businesses/[^/]+/products
        regex_priority: 100
        strip_path: false
        plugins:
          - name: pos-internal-context
            config:
              jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
              internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
              internal_context_ttl: 60
              require_business_scope: true
              tenancy_membership_url: http://tenancy:3000/v1/internal/membership
              internal_api_key: '{vault://env/INTERNAL_API_KEY}'
              membership_cache_ttl: 30

  - name: inventory
    url: http://inventory:3000
    routes:
      - name: inventory-tenant
        paths:
          - ~/v1/businesses/[^/]+/stock
          - ~/v1/businesses/[^/]+/alert-config
        regex_priority: 100
        strip_path: false
        plugins:
          - name: pos-internal-context
            config:
              jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
              internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
              internal_context_ttl: 60
              require_business_scope: true
              tenancy_membership_url: http://tenancy:3000/v1/internal/membership
              internal_api_key: '{vault://env/INTERNAL_API_KEY}'
              membership_cache_ttl: 30

  - name: sales
    url: http://sales:3000
    routes:
      - name: sales-tenant
        paths:
          - ~/v1/businesses/[^/]+/sales
        regex_priority: 100
        strip_path: false
        plugins:
          - name: pos-internal-context
            config:
              jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
              internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
              internal_context_ttl: 60
              require_business_scope: true
              tenancy_membership_url: http://tenancy:3000/v1/internal/membership
              internal_api_key: '{vault://env/INTERNAL_API_KEY}'
              membership_cache_ttl: 30
      # Trade customers + accounts receivable (Phase 07). Business-scoped.
      - name: sales-customers-tenant
        paths:
          - ~/v1/businesses/[^/]+/customers
        regex_priority: 100
        strip_path: false
        plugins:
          - name: pos-internal-context
            config:
              jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
              internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
              internal_context_ttl: 60
              require_business_scope: true
              tenancy_membership_url: http://tenancy:3000/v1/internal/membership
              internal_api_key: '{vault://env/INTERNAL_API_KEY}'
              membership_cache_ttl: 30
      # Public receipt — no auth, no internal-context plugin.
      - name: receipt-public
        paths:
          - ~/v1/r/[^/]+
        regex_priority: 100
        strip_path: false
        plugins:
          # Public + unauthenticated: cap scraping of receipt tokens.
          - name: rate-limiting
            config: { minute: 120, policy: local, limit_by: ip }

  - name: winger
    url: http://winger:3000
    routes:
      # Owner-managed winger accounts — business-scoped like any other tenant route.
      - name: winger-accounts-tenant
        paths:
          - ~/v1/businesses/[^/]+/winger-accounts
        regex_priority: 100
        strip_path: false
        plugins:
          - name: pos-internal-context
            config:
              jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
              internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
              internal_context_ttl: 60
              require_business_scope: true
              tenancy_membership_url: http://tenancy:3000/v1/internal/membership
              internal_api_key: '{vault://env/INTERNAL_API_KEY}'
              membership_cache_ttl: 30
      # Winger portal — verified user context, NO membership scope. The winger
      # service authorizes each call against its own winger_account rows.
      - name: winger-portal
        paths:
          - /v1/winger
        strip_path: false
        plugins:
          - name: pos-internal-context
            config:
              jwt_secret: '{vault://env/JWT_ACCESS_SECRET}'
              internal_context_secret: '{vault://env/INTERNAL_CONTEXT_SECRET}'
              internal_context_ttl: 60
              require_business_scope: false
              tenancy_membership_url: http://tenancy:3000/v1/internal/membership
              internal_api_key: '{vault://env/INTERNAL_API_KEY}'
              membership_cache_ttl: 30

plugins:
  - name: cors
    config:
      origins: ['*']
      methods: [GET, POST, PATCH, PUT, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, X-Request-Id]
      credentials: false
  - name: request-size-limiting
    # 12 MB: a 10 MB product image plus multipart overhead. The catalog service
    # enforces the real 10 MB image cap with a friendly `image_too_large` error.
    config: { allowed_payload_size: 12 }
  - name: correlation-id
    config: { header_name: X-Request-Id, generator: uuid, echo_downstream: true }
